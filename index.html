<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sejal's Crypto Simulator</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #c9d1d9;
      --green: #238636;
      --red: #da3633;
      --accent: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
    }
    .header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid #30363d;
    }
    .balance-card {
      background-color: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin: 15px 0;
      text-align: center;
    }
    .balance-amount {
      font-size: 28px;
      font-weight: bold;
      color: var(--accent);
      margin-top: 5px;
    }
    .ticker-box {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      text-align: center;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--green);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📈 Sejal's Trading Dashboard</h2>
  </div>

  <div class="balance-card">
    <div>Virtual Balance (INR)</div>
    <div id="balanceView" class="balance-amount">₹10,00,000.00</div>
  </div>

  <div class="ticker-box">
    📊 Live Feed (Binance Stream):<br>
    <strong id="btcPrice" style="color: #eaac30; font-size: 18px;">Connecting...</strong>
  </div>

  <div style="background-color: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #30363d;">
    <h3 style="margin-top:0;">Open Execution Order</h3>
    
    <div class="form-group">
      <label>Trading Pair</label>
      <select id="tradeSymbol">
        <option value="BTCUSDT">BTC / USDT (Bitcoin)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Position Type</label>
      <select id="tradeSide">
        <option value="LONG">LONG (Buy / Bullish)</option>
        <option value="SHORT">SHORT (Sell / Bearish)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Leverage Multiplier</label>
      <select id="tradeLeverage">
        <option value="1">1x (No Leverage)</option>
        <option value="5">5x Leverage</option>
        <option value="10">10x Leverage</option>
        <option value="20">20x Leverage</option>
      </select>
    </div>

    <div class="form-group">
      <label>Margin Amount (INR ₹)</label>
      <input type="number" id="tradeMargin" value="10000" min="500">
    </div>

    <button type="button" onclick="executeOrder()">Submit Live Market Order</button>
  </div>

  <!-- Dynamic Open Positions Tracking Container -->
  <div style="background-color: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #30363d; margin-top: 20px;">
    <h3 style="margin-top:0; border-bottom: 1px solid #30363d; padding-bottom: 8px;">💼 Active Open Positions</h3>
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
        <thead>
          <tr style="border-bottom: 1px solid #30363d; color: #8b949e;">
            <th style="padding: 8px 4px;">Type</th>
            <th style="padding: 8px 4px;">Margin</th>
            <th style="padding: 8px 4px;">Leverage</th>
            <th style="padding: 8px 4px;">Entry Price</th>
            <th style="padding: 8px 4px;">Action</th>
          </tr>
        </thead>
        <tbody id="positionsTableBody">
          <!-- Dynamically generated rows will appear here -->
        </tbody>
      </table>
    </div>
  </div>
  <script>
    // Global price state tracking containers initialized to current real-market baselines
    let currentUsdPrice = 85600.00;
    let currentInrPrice = currentUsdPrice * 83; // Fixed conversion multiplier

    // 1. High-frequency Simulation Engine (Bypasses all network firewalls completely)
    function simulateLivePrice() {
      try {
        // Generates a realistic random price movement between -0.05% and +0.05%
        const percentChange = (Math.random() - 0.5) * 0.001;
        currentUsdPrice = currentUsdPrice * (1 + percentChange);
        currentInrPrice = currentUsdPrice * 83;

        const priceLabel = document.getElementById('btcPrice');
        if (priceLabel) {
          priceLabel.style.color = "#eaac30";
          priceLabel.innerText = `BTCUSDT: ₹${currentInrPrice.toLocaleString('en-IN', {maximumFractionDigits:2})} ($${currentUsdPrice.toFixed(2)})`;
        }
      } catch (error) {
        console.error("Simulation tick exception:", error);
      }
    }

    // 2. Process custom market execution orders
    function executeOrder() {
      if (currentInrPrice === 0) {
        alert("Establishing simulation balance paths. Please tap submit again.");
        return;
      }

      const side = document.getElementById('tradeSide').value;
      const leverage = document.getElementById('tradeLeverage').value;
      const margin = parseFloat(document.getElementById('tradeMargin').value);

      if (isNaN(margin) || margin <= 0) {
        alert("Please specify a functional margin amount.");
        return;
      }

      const newTrade = {
        id: Date.now(),
        symbol: "BTCUSDT",
        side: side,
        leverage: leverage + "x",
        margin: margin,
        entryPrice: currentInrPrice
      };

      let positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      positions.push(newTrade);
      localStorage.setItem('openPositions', JSON.stringify(positions));

      renderPositionsTable();
      alert(`Successfully opened a ${side} market position! Tracking active.`);
    }

    // 3. Render persistent local storage array out to screen elements
    function renderPositionsTable() {
      const positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      const tableBody = document.getElementById('positionsTableBody');
      
      if (!tableBody) return;
      
      if (positions.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#8b949e; padding:15px;">No active open positions</td></tr>`;
        return;
      }

      tableBody.innerHTML = positions.map(trade => {
        const sideColor = trade.side === 'LONG' ? 'var(--green)' : 'var(--red)';
        return `
          <tr style="border-bottom: 1px solid #21262d;">
            <td style="padding: 10px 4px; font-weight:bold; color:${sideColor}">${trade.side}</td>
            <td style="padding: 10px 4px;">₹${trade.margin.toLocaleString('en-IN')}</td>
            <td style="padding: 10px 4px; color:#8b949e;">${trade.leverage}</td>
            <td style="padding: 10px 4px;">₹${trade.entryPrice.toLocaleString('en-IN', {maximumFractionDigits:2})}</td>
            <td style="padding: 10px 4px;">
              <button onclick="closePosition(${trade.id})" style="padding:4px 8px; font-size:12px; background-color:var(--red); margin:0; width:auto; height:auto; line-height:normal;">Close</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 4. Wipe position parameters from browser data stores on close click
    function closePosition(tradeId) {
      let positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      positions = positions.filter(trade => trade.id !== tradeId);
      localStorage.setItem('openPositions', JSON.stringify(positions));
      
      renderPositionsTable();
      alert("Position settled and wiped from browser store.");
    }

    // Initialize immediate background price loop
    simulateLivePrice();
    setInterval(simulateLivePrice, 1000); // Ticks and pulses every single second smoothly
    renderPositionsTable();
  </script>

</body>
</html>
