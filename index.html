<!DOCTYPE html> <html> <head>
    <link rel="manifest" href="./manifest.json">
</head>

<meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title>Sim</title> <style> :root{--bg:#0d1117;--card:#161b22;--text:#c9d1d9;--green:#238636;--gtxt:#00c873;--red:#da3633;--rtxt:#ff3b30;--accent:#58a6ff;} body{font-family:sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;} .header{text-align:center;padding:10px 0;border-bottom:1px solid #30363d;position:relative;} .card-box{background:var(--card);border:1px solid #30363d;border-radius:8px;padding:20px;margin:15px 0;text-align:center;} .amt{font-size:28px;font-weight:bold;color:var(--accent);} .t-box{background:#21262d;padding:12px;border-radius:6px;text-align:center;margin-bottom:20px;border-left:4px solid var(--accent);font-family:monospace;} .f-grp{margin-bottom:12px;text-align:left;} label{display:block;margin-bottom:5px;font-size:14px;} select,input{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;color:white;border-radius:6px;box-sizing:border-box;} button{width:100%;padding:12px;background:var(--green);color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;} .t-cont{overflow-x:auto;width:100%;margin-top:10px;-webkit-overflow-scrolling:touch;} table{width:100%;border-collapse:collapse;min-width:650px;} th{color:#8b949e;border-bottom:1px solid #30363d;padding:8px 6px;font-size:13px;white-space:nowrap;} td{padding:10px 6px;border-bottom:1px solid #21262d;font-size:13px;white-space:nowrap;} .r-align{text-align:right;} .c-btn{padding:6px 12px;background:var(--red);color:white;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:12px;} .out-btn{position:absolute;right:10px;top:12px;background:#30363d;color:white;border:none;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer;} #authScreen,#mainScreen{display:none;} </style> </head> <body> <div id="authScreen"> <div class="header"><h2>Trading Gate</h2></div> <div class="card-box" style="text-align:left;max-width:400px;margin:40px auto;"> <h3 id="authTitle">Login</h3> <div class="f-grp"><label>Username</label><input type="text" id="uName"></div> <div class="f-grp"><label>Password</label><input type="password" id="uPass"></div> <button type="button" id="primaryAuthBtn" onclick="handleAuth()">Login</button> <div style="margin-top:15px;text-align:center;font-size:13px;"> <a href="#" id="toggleAuthLink" onclick="toggleAuthMode()" style="color:var(--accent);text-decoration:none;">Create account</a> </div></div></div> <div id="mainScreen"> <div class="header"><h2>Dashboard</h2><button class="out-btn" onclick="logout()">Logout</button></div> <div style="text-align:center;margin-top:5px;color:#8b949e;font-size:14px;">User: <span id="userBadge" style="color:white;font-weight:bold;"></span></div> <div class="card-box"><div>Balance (INR)</div><div id="balView" class="amt">₹10,00,000.00</div></div> <div class="t-box">Prices:<br><div id="bPr" style="color:#eaac30;margin-top:4px;">BTC: Load...</div><div id="ePr" style="color:#58a6ff;margin-top:4px;">ETH: Load...</div></div> <div class="card-box" style="text-align:left;"><h3>Order</h3> <div class="f-grp"><label>Pair</label><select id="tSym"><option value="BTCUSDT">BTC/USDT</option><option value="ETHUSDT">ETH/USDT</option></select></div> <div class="f-grp"><label>Side</label><select id="tSide"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select></div> <div class="f-grp"><label>Lev</label><select id="tLev"><option value="1">1x</option><option value="5">5x</option><option value="10">10x</option></select></div> <div class="f-grp"><label>Margin (₹)</label><input type="number" id="tMgn" value="10000"></div> <div class="f-grp"><label>TP Price (₹)</label><input type="number" id="tTP" value="0"></div> <div class="f-grp"><label>SL Price (₹)</label><input type="number" id="tSL" value="0"></div> <button type="button" onclick="buy()">Submit</button></div> <div class="card-box" style="text-align:left;"><h3>Positions</h3> <div class="t-cont"><table><thead><tr><th style="text-align:left;">Pair</th><th style="text-align:left;">Side</th><th style="text-align:left;">Margin</th><th style="text-align:left;">Lev</th><th style="text-align:left;">Entry</th><th style="text-align:left;">TP/SL</th><th class="r-align">PnL</th><th class="r-align">Action</th></tr></thead> <tbody id="pBody"><tr><td colspan="8" style="text-align:center;color:#8b949e;padding:20px;">No positions</td></tr></tbody></table></div></div></div> <script> var px={BTCUSDT:{u:86519.61,i:86519.61*83},ETHUSDT:{u:2610.45,i:2610.45*83}};var bal=1000000.00;var currentUser="";var authMode="LOGIN"; function toggleAuthMode(){var t=document.getElementById('authTitle');var b=document.getElementById('primaryAuthBtn');var l=document.getElementById('toggleAuthLink'); if(authMode==="LOGIN"){authMode="SIGNUP";t.innerText="Create Account";b.innerText="Register Account";l.innerText="Have account? Login"; }else{authMode="LOGIN";t.innerText="Account Login";b.innerText="Login";l.innerText="Create account";}} function handleAuth(){var u=document.getElementById('uName').value.trim();var p=document.getElementById('uPass').value.trim();if(!u||!p){alert("Enter details");return;} var users=JSON.parse(localStorage.getItem('sim_users'))||{};if(authMode==="SIGNUP"){if(users[u]){alert("Username taken");return;}users[u]=p; localStorage.setItem('sim_users',JSON.stringify(users));localStorage.setItem('usrb_'+u,'1000000.00');localStorage.setItem('usrp_'+u,'[]'); authMode="LOGIN";toggleAuthMode();alert("Registered! Please login.");}else{if(!users[u]||users[u]!==p){alert("Wrong password");return;} currentUser=u;localStorage.setItem('sim_session',u);document.getElementById('uName').value="";document.getElementById('uPass').value="";loadUserDashboard();}} function loadUserDashboard(){document.getElementById('authScreen').style.display='none';document.getElementById('mainScreen').style.display='block'; document.getElementById('userBadge').innerText=currentUser;var sb=localStorage.getItem('usrb_'+currentUser);bal=sb!==null?parseFloat(sb):1000000.00;upBal();draw();} function logout(){currentUser="";localStorage.removeItem('sim_session');document.getElementById('mainScreen').style.display='none';document.getElementById('authScreen').style.display='block'; authMode="LOGIN";var t=document.getElementById('authTitle');var b=document.getElementById('primaryAuthBtn');var l=document.getElementById('toggleAuthLink');t.innerText="Account Login";b.innerText="Login";l.innerText="Create account";} function upBal(){var v=document.getElementById('balView');if(v){v.innerText='₹'+bal.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}if(currentUser){localStorage.setItem('usrb_'+currentUser,bal.toString());}} function tick(){try{var bc=(Math.random()-0.5)*0.001;px.BTCUSDT.u*=(1+bc);px.BTCUSDT.i=px.BTCUSDT.u*83;var ec=(Math.random()-0.5)*0.0015;px.ETHUSDT.u*=(1+ec);px.ETHUSDT.i=px.ETHUSDT.u*83; var bL=document.getElementById('bPr');if(bL){bL.innerText='BTC: ₹'+px.BTCUSDT.i.toLocaleString('en-IN',{maximumFractionDigits:2})+' ($'+px.BTCUSDT.u.toFixed(2)+')';} var eL=document.getElementById('ePr');if(eL){eL.innerText='ETH: ₹'+px.ETHUSDT.i.toLocaleString('en-IN',{maximumFractionDigits:2})+' ($'+px.ETHUSDT.u.toFixed(2)+')';}if(currentUser){chk();upPnL();}}catch(err){console.error(err);}} function chk(){try{var list=JSON.parse(localStorage.getItem('usrp_'+currentUser))||[];var hits=[];list.forEach(function(t){var p=px[t.s].i;var tp=t.tp>0;var sl=t.sl>0;var l=t.d==='LONG';var s=t.d==='SHORT'; var hTP=(tp&&((l&&p>=t.tp)||(s&&p<=t.tp)));var hSL=(sl&&((l&&p<=t.sl)||(s&&p>=t.sl)));if(hTP||hSL){hits.push(t.id);}});hits.forEach(function(id){cut(id,true);});}catch(e){console.error(e);}} function upPnL(){try{var list=JSON.parse(localStorage.getItem('usrp_'+currentUser))||[];list.forEach(function(t){var c=document.getElementById('pnl-'+t.id);if(!c)return;var vD=c.querySelector('.pnl-v');var pD=c.querySelector('.pnl-p'); var p=px[t.s].i;var df=(p-t.e)/t.e;if(t.d==='SHORT'){df=-df;}var pct=df*t.v*100;var amt=t.m*(pct/100);var w=amt>=0;c.style.color=w?"var(--gtxt)":"var(--rtxt)";var s=w?"+":""; if(vD)vD.innerText=s+'₹'+amt.toFixed(2);if(pD)pD.innerText='('+s+pct.toFixed(2)+'%)';});}catch(e){console.error(e);}} function buy(){try{var sym=document.getElementById('tSym').value;var side=document.getElementById('tSide').value;var lev=document.getElementById('tLev').value;var mgn=parseFloat(document.getElementById('tMgn').value); var tpV=parseFloat(document.getElementById('tTP').value)||0;var slV=parseFloat(document.getElementById('tSL').value)||0;if(isNaN(mgn)||mgn<=0){alert("Error");return;}if(mgn>bal){alert("No funds");return;} bal-=mgn;upBal();var nt={id:Date.now(),s:sym,d:side,v:parseInt(lev),m:mgn,e:px[sym].i,tp:tpV,sl:slV};var list=JSON.parse(localStorage.getItem('usrp_'+currentUser))||[];list.push(nt); localStorage.setItem('usrp_'+currentUser,JSON.stringify(list));draw();alert('Opened');}catch(err){console.error(err);}} function draw(){try{var list=JSON.parse(localStorage.getItem('usrp_'+currentUser))||[];var b=document.getElementById('pBody');if(!b)return;if(list.length===0){b.innerHTML='<tr><td colspan="8" style="text-align:center;color:#8b949e;padding:20px;">No positions</td></tr>';return;} var rows='';list.forEach(function(t){var cls=t.d==='LONG'?'var(--gtxt)':'var(--rtxt)';var eS=t.e.toLocaleString('en-IN',{maximumFractionDigits:2});var tpS=t.tp>0?'TP: ₹'+t.tp.toLocaleString('en-IN'):'TP: None';var slS=t.sl>0?'SL: ₹'+t.sl.toLocaleString('en-IN'):'SL: None'; rows+='<tr><td>'+t.s.replace("USDT","")+'</td><td style="font-weight:bold;color:'+cls+';">'+t.d+'</td><td>₹'+t.m.toLocaleString('en-IN')+'</td><td>'+t.v+'x</td><td>₹'+eS+'</td><td style="font-size:11px;color:#8b949e;"><div>'+tpS+'</div><div>'+slS+'</div></td><td class="r-align" id="pnl-'+t.id+'"><div class="pnl-v">₹0.00</div><div class="pnl-p">(0.00%)</div></td><td class="r-align"><button class="c-btn" onclick="cut('+t.id+ ',false)">Close</button></td></tr>';});b.innerHTML=rows;upPnL();}catch(err){console.error(err);}} function cut(id,auto){try{var list=JSON.parse(localStorage.getItem('usrp_'+currentUser))||[];var idx=list.findIndex(function(t){return t.id===id;});if(idx!==-1){var t=list[idx];var p=px[t.s].i;var df=(p-t.e)/t.e;if(t.d==='SHORT'){df=-df;} var pct=df*t.v*100;var amt=t.m*(pct/100);bal+=(t.m+amt);upBal();list.splice(idx,1);localStorage.setItem('usrp_'+currentUser,JSON.stringify(list));draw();if(auto){alert('Triggered');}}}catch(e){console.error(e);}} var session=localStorage.getItem('sim_session');if(session){currentUser=session;loadUserDashboard();}else{document.getElementById('authScreen').style.display='block';} tick();setInterval(tick,1000); </script> </body> </html>
