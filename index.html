<!DOCTYPE html>  <html>  <head>      <meta charset="UTF-8">      <meta name="viewport" content="width=device-width,initial-scale=1.0">      <title>Sim</title>      <link rel="manifest" href="./manifest.json">     <style>          :root{--bg:#0d1117;--card:#161b22;--text:#c9d1d9;--green:#238636;--gtxt:#00c873;--red:#da3633;--rtxt:#ff3b30;--accent:#58a6ff;}          body{font-family:sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;}          .header{text-align:center;padding:10px 0;border-bottom:1px solid #30363d;position:relative;}          .card-box{background:var(--card);border:1px solid #30363d;border-radius:8px;padding:20px;margin:15px 0;text-align:center;}          .amt{font-size:28px;font-weight:bold;color:var(--accent);}          .t-box{background:#21262d;padding:12px;border-radius:6px;text-align:center;margin-bottom:20px;border-left:4px solid var(--accent);font-family:monospace;}          .f-grp{margin-bottom:12px;text-align:left;}          label{display:block;margin-bottom:5px;font-size:14px;}          select,input{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;color:white;border-radius:6px;box-sizing:border-box;}          button{width:100%;padding:12px;background:var(--green);color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}          .t-cont{overflow-x:auto;width:100%;margin-top:10px;-webkit-overflow-scrolling:touch;}          table{width:100%;border-collapse:collapse;min-width:650px;}          th{color:#8b949e;border-bottom:1px solid #30363d;padding:8px 6px;font-size:13px;white-space:nowrap;}          td{padding:10px 6px;border-bottom:1px solid #21262d;font-size:13px;white-space:nowrap;}          .r-align{text-align:right;}          .c-btn{padding:6px 12px;background:var(--red);color:white;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:12px;}          .out-btn{position:absolute;right:10px;top:12px;background:#30363d;color:white;border:none;padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer;}          #authScreen,#mainScreen{display:none;}      </style>  </head>  <body>  <div id="authScreen">      <div class="header"><h2>Trading Gate</h2></div>      <div class="card-box" style="text-align:left;max-width:400px;margin:40px auto;">          <h3 id="authTitle">Login</h3>          <div class="f-grp"><label>Username</label><input type="text" id="uName"></div>          <div class="f-grp"><label>Password</label><input type="password" id="uPass"></div>          <button type="button" id="primaryAuthBtn" onclick="handleAuth()">Login</button>          <div style="margin-top:15px;text-align:center;font-size:13px;">              <a href="#" id="toggleAuthLink" onclick="toggleAuthMode()" style="color:var(--accent);text-decoration:none;">Create account</a>          </div>     </div> </div>  <div id="mainScreen">      <div class="header"><h2>Dashboard</h2><button class="out-btn" onclick="logout()">Logout</button></div>      <div style="text-align:center;margin-top:5px;color:#8b949e;font-size:14px;">User: <span id="userBadge" style="color:white;font-weight:bold;"></span></div>      <div class="card-box"><div>Balance (INR)</div><div id="balView" class="amt">₹10,00,000.00</div></div>      <div class="t-box">Prices:<br><div id="bPr" style="color:#eaac30;margin-top:4px;">BTC: Load...</div><div id="ePr" style="color:#58a6ff;margin-top:4px;">ETH: Load...</div></div>      <div class="card-box" style="text-align:left;"><h3>Order</h3>          <div class="f-grp"><label>Pair</label><select id="tSym"><option value="BTCUSDT">BTC/USDT</option><option value="ETHUSDT">ETH/USDT</option></select></div>          <div class="f-grp"><label>Side</label><select id="tSide"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select></div>          <div class="f-grp"><label>Lev</label><select id="tLev"><option value="1">1x</option><option value="5">5x</option><option value="10">10x</option></select></div>          <div class="f-grp"><label>Margin (₹)</label><input type="number" id="tMgn" value="10000"></div>          <div class="f-grp"><label>TP Price (₹)</label><input type="number" id="tTP" value="0"></div>          <div class="f-grp"><label>SL Price (₹)</label><input type="number" id="tSL" value="0"></div>          <button type="button" onclick="buy()">Submit</button>     </div>      <div class="card-box" style="text-align:left;"><h3>Positions</h3>          <div class="t-cont"><table><thead><tr><th style="text-align:left;">Pair</th><th style="text-align:left;">Side</th><th style="text-align:left;">Margin</th><th style="text-align:left;">Lev</th><th style="text-align:left;">Entry</th><th style="text-align:left;">TP/SL</th><th class="r-align">PnL</th><th class="r-align">Action</th></tr></thead>              <tbody id="pBody"><tr><td colspan="8" style="text-align:center;color:#8b949e;padding:20px;">No positions</td></tr></tbody></table></div>     </div> </div> 
        
      
</body> 
</html>
