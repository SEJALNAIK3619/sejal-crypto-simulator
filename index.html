<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sejal's Crypto Simulator</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #c9d1d9;
      --green: #238636;
      --red: #da3633;
      --accent: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
    }
    .header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid #30363d;
    }
    .balance-card {
      background-color: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin: 15px 0;
      text-align: center;
    }
    .balance-amount {
      font-size: 28px;
      font-weight: bold;
      color: var(--accent);
      margin-top: 5px;
    }
    .ticker-box {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      text-align: center;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--green);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📈 Sejal's Trading Dashboard</h2>
  </div>

  <div class="balance-card">
    <div>Virtual Balance (INR)</div>
    <div id="balanceView" class="balance-amount">₹10,00,000.00</div>
  </div>

  <div class="ticker-box">
    📊 Live Feed (Simulated Stream):<br>
    <strong id="btcPrice" style="color: #eaac30; font-size: 18px;">Connecting...</strong>
  </div>

  <div style="background-color: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #30363d;">
    <h3 style="margin-top:0;">Open Execution Order</h3>
    
    <div class="form-group">
      <label>Trading Pair</label>
      <select id="tradeSymbol">
        <option value="BTCUSDT">BTC / USDT (Bitcoin)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Position Type</label>
      <select id="tradeSide">
        <option value="LONG">LONG (Buy / Bullish)</option>
        <option value="SHORT">SHORT (Sell / Bearish)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Leverage Multiplier</label>
      <select id="tradeLeverage">
        <option value="1">1x (No Leverage)</option>
        <option value="5">5x Leverage</option>
        <option value="10">10x Leverage</option>
        <option value="20">20x Leverage</option>
      </select>
    </div>

    <div class="form-group">
      <label>Margin Amount (INR ₹)</label>
      <input type="number" id="tradeMargin" value="10000" min="500">
    </div>

    <button type="button" onclick="executeOrder()">Submit Live Market Order</button>
  </div>
<thead>
          <tr style="border-bottom: 1px solid #30363d; color: #8b949e;">
            <th style="padding: 8px 4px;">Type</th>
            <th style="padding: 8px 4px;">Margin</th>
            <th style="padding: 8px 4px;">Leverage</th>
            <th style="padding: 8px 4px;">Entry Price</th>
            <th style="padding: 8px 4px;">Live PnL</th> <!-- ADD THIS LINE -->
            <th style="padding: 8px 4px;">Action</th>
          </tr>
        </thead>
  <script>
    let currentUsdPrice = 86239.03;
    let currentInrPrice = currentUsdPrice * 83;

    // 1. Simulation Engine - Loops every second and updates prices AND PnL columns
    function simulateLivePrice() {
      try {
        const percentChange = (Math.random() - 0.5) * 0.001;
        currentUsdPrice = currentUsdPrice * (1 + percentChange);
        currentInrPrice = currentUsdPrice * 83;

        const priceLabel = document.getElementById('btcPrice');
        if (priceLabel) {
          priceLabel.style.color = "#eaac30";
          priceLabel.innerText = `BTCUSDT: ₹${currentInrPrice.toLocaleString('en-IN', {maximumFractionDigits:2})} ($${currentUsdPrice.toFixed(2)})`;
        }

        // Trigger real-time calculation refresh for all active table items
        updateLivePnL();

      } catch (error) {
        console.error("Simulation tick exception:", error);
      }
    }

    // 2. Submit Order Logic
    function executeOrder() {
      const side = document.getElementById('tradeSide').value;
      const leverageText = document.getElementById('tradeLeverage').value;
      const margin = parseFloat(document.getElementById('tradeMargin').value);

      if (isNaN(margin) || margin <= 0) {
        alert("Please specify a functional margin amount.");
        return;
      }

      const newTrade = {
        id: Date.now(),
        symbol: "BTCUSDT",
        side: side,
        leverage: parseInt(leverageText), // Parsed as a clean number for financial calculations
        margin: margin,
        entryPrice: currentInrPrice
      };

      let positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      positions.push(newTrade);
      localStorage.setItem('openPositions', JSON.stringify(positions));

      renderPositionsTable();
      alert(`Successfully opened a ${side} market position! Tracking active.`);
    }

    // 3. Render Table Structure
    function renderPositionsTable() {
      const positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      const tableBody = document.getElementById('positionsTableBody');
      
      if (!tableBody) return;
      
      if (positions.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#8b949e; padding:15px;">No active open positions</td></tr>`;
        return;
      }

      tableBody.innerHTML = positions.map(trade => {
        const sideColor = trade.side === 'LONG' ? 'var(--green)' : 'var(--red)';
        return `
          <tr style="border-bottom: 1px solid #21262d;" id="row-${trade.id}">
            <td style="padding: 10px 4px; font-weight:bold; color:${sideColor}">${trade.side}</td>
            <td style="padding: 10px 4px;">₹${trade.margin.toLocaleString('en-IN')}</td>
            <td style="padding: 10px 4px; color:#8b949e;">${trade.leverage}x</td>
            <td style="padding: 10px 4px;">₹${trade.entryPrice.toLocaleString('en-IN', {maximumFractionDigits:2})}</td>
            <!-- The specific text container our script targets every second -->
            <td style="padding: 10px 4px; font-weight:bold;" id="pnl-${trade.id}">₹0.00 (0.00%)</td>
            <td style="padding: 10px 4px;">
              <button onclick="closePosition(${trade.id})" style="padding:4px 8px; font-size:12px; background-color:var(--red); margin:0; width:auto; height:auto; line-height:normal;">Close</button>
            </td>
          </tr>
        `;
      }).join('');
      
      // Calculate immediate values right after structural table layout matches elements
      updateLivePnL();
    }

    // 4. Mathematical Real-Time PnL Engine
    function updateLivePnL() {
      const positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      
      positions.forEach(trade => {
        const pnlLabel = document.getElementById(`pnl-${trade.id}`);
        if (!pnlLabel) return;

        // Calculate the raw price shift direction percentage
        let priceDirectionFactor = (currentInrPrice - trade.entryPrice) / trade.entryPrice;
        
        // If it's a SHORT position, inverse the price logic (you make money when the price falls)
        if (trade.side === 'SHORT') {
          priceDirectionFactor = -priceDirectionFactor;
        }

        // Apply leverage settings to calculate the final simulated return parameters
        const percentageReturn = priceDirectionFactor * trade.leverage * 100;
        const currencyReturnAmount = trade.margin * (percentageReturn / 100);

        // Visual coloring shifts based on positive or negative balances
        if (currencyReturnAmount >= 0) {
          pnlLabel.style.color = "var(--green)";
          pnlLabel.innerText = `+₹${currencyReturnAmount.toFixed(2)} (+${percentageReturn.toFixed(2)}%)`;
        } else {
          pnlLabel.style.color = "var(--red)";
          pnlLabel.innerText = `₹${currencyReturnAmount.toFixed(2)} (${percentageReturn.toFixed(2)}%)`;
        }
      });
    }

    // 5. Close Position settled tracking removal
    function closePosition(tradeId) {
      let positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      positions = positions.filter(trade => trade.id !== tradeId);
      localStorage.setItem('openPositions', JSON.stringify(positions));
      
      renderPositionsTable();
      alert("Position settled and wiped from browser store.");
    }

    // Launch structural processes on startup context
    simulateLivePrice();
    setInterval(simulateLivePrice, 1000); // Drives active loops every 1 second
    renderPositionsTable();
  </script>
</body>
</html>
