<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sejal's Crypto Simulator</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #c9d1d9;
      --green: #238636;
      --red: #da3633;
      --accent: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
    }
    .header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid #30363d;
    }
    .balance-card {
      background-color: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin: 15px 0;
      text-align: center;
    }
    .balance-amount {
      font-size: 28px;
      font-weight: bold;
      color: var(--accent);
      margin-top: 5px;
    }
    .ticker-box {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      text-align: center;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--green);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
    }
    button:active {
      opacity: 0.8;
    }
    
    /* Optimized mobile layout styles to prevent text from cutting off */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
    }
    th, td {
      padding: 6px 2px !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>📈 Sejal's Trading Dashboard</h2>
  </div>

  <div class="balance-card">
    <div>Virtual Balance (INR)</div>
    <div id="balanceView" class="balance-amount">₹10,00,000.00</div>
  </div>

  <div class="ticker-box">
    📊 Live Feed (Simulated Stream):<br>
    <strong id="btcPrice" style="color: #eaac30; font-size: 18px;">Connecting...</strong>
  </div>

  <div style="background-color: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #30363d;">
    <h3 style="margin-top:0;">Open Execution Order</h3>
    
    <div class="form-group">
      <label>Trading Pair</label>
      <select id="tradeSymbol">
        <option value="BTCUSDT">BTC / USDT (Bitcoin)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Position Type</label>
      <select id="tradeSide">
        <option value="LONG">LONG (Buy / Bullish)</option>
        <option value="SHORT">SHORT (Sell / Bearish)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Leverage Multiplier</label>
      <select id="tradeLeverage">
        <option value="1">1x (No Leverage)</option>
        <option value="5">5x Leverage</option>
        <option value="10">10x Leverage</option>
        <option value="20">20x Leverage</option>
      </select>
    </div>

    <div class="form-group">
      <label>Margin Amount (INR ₹)</label>
      <input type="number" id="tradeMargin" value="10000" min="500">
    </div>

    <button type="button" onclick="executeOrder()">Submit Live Market Order</button>
  </div>

  <!-- Dynamic Active Open Positions Container Box -->
  <div style="background-color: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid #30363d; margin-top: 20px;">
    <h3 style="margin-top:0; border-bottom: 1px solid #30363d; padding-bottom: 8px;">💼 Active Open Positions</h3>
    <div style="overflow-x: auto; margin: 0 -4px;">
      <table>
        <thead>
          <tr style="border-bottom: 1px solid #30363d; color: #8b949e;">
            <th>Type</th>
            <th>Margin</th>
            <th>Lev</th>
            <th>Entry Price</th>
            <th>Live PnL</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="positionsTableBody">
          <!-- Dynamically generated position rows print here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let currentUsdPrice = 86519.61;
    let currentInrPrice = currentUsdPrice * 83;
    const BASE_STARTING_BALANCE = 1000000.00;

    // 1. High-frequency price movement simulator loop
    function simulateLivePrice() {
      try {
        const percentChange = (Math.random() - 0.5) * 0.001;
        currentUsdPrice = currentUsdPrice * (1 + percentChange);
        currentInrPrice = currentUsdPrice * 83;

        const priceLabel = document.getElementById('btcPrice');
        if (priceLabel) {
          priceLabel.style.color = "#eaac30";
          priceLabel.innerText = `BTCUSDT: ₹${currentInrPrice.toLocaleString('en-IN', {maximumFractionDigits:2})} ($${currentUsdPrice.toFixed(2)})`;
        }

        updateLivePnL();
        updateAvailableBalanceDisplay();

      } catch (error) {
        console.error("Simulation tick engine crash:", error);
      }
    }

    // Helper loop tallying total margin committed inside browser storage
    function getActiveMarginTotal() {
      const positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      return positions.reduce((total, trade) => total + trade.margin, 0);
    }

    // 2. Real-time Wallet Arithmetic Renderer
    function updateAvailableBalanceDisplay() {
      let walletRecord = parseFloat(localStorage.getItem('userWalletBalance'));
      if (isNaN(walletRecord)) {
        walletRecord = BASE_STARTING_BALANCE;
        localStorage.setItem('userWalletBalance', walletRecord);
      }
      
      const currentTiedMargin = getActiveMarginTotal();
      const calculatedDisplayValue = walletRecord - currentTiedMargin;
      
      const balanceLabel = document.getElementById('balanceView');
      if (balanceLabel) {
        balanceLabel.innerText = `₹${calculatedDisplayValue.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
      }
    }

    // 3. Process Execution Orders
    function executeOrder() {
      const side = document.getElementById('tradeSide').value;
      const leverageText = document.getElementById('tradeLeverage').value;
      const margin = parseFloat(document.getElementById('tradeMargin').value);

      if (isNaN(margin) || margin <= 0) {
        alert("Please specify a functional margin amount.");
        return;
      }

      let walletRecord = parseFloat(localStorage.getItem('userWalletBalance')) || BASE_STARTING_BALANCE;
      const currentTiedMargin = getActiveMarginTotal();
      const freeAvailableCash = walletRecord - currentTiedMargin;

      if (margin > freeAvailableCash) {
        alert("Insufficient balance funds to cover order margin costs!");
        return;
      }

      const newTrade = {
        id: Date.now(),
        symbol: "BTCUSDT",
        side: side,
        leverage: parseInt(leverageText),
        margin: margin,
        entryPrice: currentInrPrice
      };

      let positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      positions.push(newTrade);
      localStorage.setItem('openPositions', JSON.stringify(positions));

      renderPositionsTable();
      updateAvailableBalanceDisplay();
      alert(`Successfully opened a ${side} market position! Margin reserved.`);
    }

    // 4. Render Layout Table rows
    function renderPositionsTable() {
      const positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      const tableBody = document.getElementById('positionsTableBody');
      
      if (!tableBody) return;
      
      if (positions.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#8b949e; padding:15px;">No active open positions</td></tr>`;
        return;
      }

      tableBody.innerHTML = positions.map(trade => {
        const sideColor = trade.side === 'LONG' ? 'var(--green)' : 'var(--red)';
        return `
          <tr style="border-bottom: 1px solid #21262d;" id="row-${trade.id}">
            <td style="font-weight:bold; color:${sideColor}">${trade.side}</td>
            <td>₹${trade.margin.toLocaleString('en-IN')}</td>
            <td style="color:#8b949e;">${trade.leverage}x</td>
            <td>₹${trade.entryPrice.toLocaleString('en-IN', {maximumFractionDigits:0})}</td>
            <td style="font-weight:bold; white-space:pre-line;" id="pnl-${trade.id}">₹0.00</td>
            <td>
              <button onclick="closePosition(${trade.id})" style="padding:4px 6px; font-size:11px; background-color:var(--red); margin:0; width:auto; height:auto; line-height:normal;">Close</button>
            </td>
          </tr>
        `;
      }).join('');
      
      updateLivePnL();
    }

    // 5. Mathematical Real-Time PnL Arithmetic Logic
    function updateLivePnL() {
      const positions = JSON.parse(localStorage.getItem('openPositions')) || [];
      
      positions.forEach(trade => {
        const pnlLabel = document.getElementById(`pnl-${trade.id}`);
        if (!pnlLabel) return;

        let priceDirectionFactor = (currentInrPrice - trade.entryPrice) / trade.entryPrice;
        
        if (trade.side === 'SHORT') {
          priceDirectionFactor = -priceDirectionFactor;
        }

        const percentageReturn = priceDirectionFactor * trade.leverage * 100;
        const currencyReturnAmount = trade.margin * (percentageReturn / 100);

        if (currencyReturnAmount >= 0) {
          pnlLabel.style.color = "var(--green)";
